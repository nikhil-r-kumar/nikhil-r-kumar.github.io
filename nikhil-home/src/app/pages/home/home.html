<div class="container">
  <h1>🏠 Nikhil's Home</h1>
  <p>Welcome to my personal app hub.</p>

  <div class="cards">
    <div class="card" *ngFor="let link of links">
      <h2>{{ link.title }}</h2>
      <p>{{ link.description }}</p>
      <button [routerLink]="link.route">Open</button>
    </div>
  </div>
</div>
