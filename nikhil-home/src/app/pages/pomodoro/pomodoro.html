<div class="pomodoro-container">
  <h1>🍅 Pomodoro Timer</h1>

  <div class="timer">
    {{ minutes }}:{{ seconds }}
  </div>

  <div class="actions">
    <button (click)="start()">Start</button>
    <button (click)="pause()">Pause</button>
    <button (click)="reset()">Reset</button>
  </div>
</div>
